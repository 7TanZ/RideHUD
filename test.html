<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Connectivity Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 600px; height: 600px; margin: 0; overflow: hidden;
      background: #000; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body { display: grid; place-items: center; padding: 42px; }
    .hud {
      width: 100%; height: 100%;
      border: 2px solid #17d4e4; border-radius: 28px; padding: 34px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    h1 { margin: 0; font-size: 40px; line-height: 1; letter-spacing: -.04em; }
    .row { font: 22px ui-monospace, Menlo, monospace; margin: 14px 0; }
    .ok   { color: #4dffb8; }
    .bad  { color: #ff9d3d; }
    .wait { color: #e5f46b; }
    .meta { color: #17d4e4; font: 14px ui-monospace, monospace; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main class="hud">
    <div class="meta">XDG · SMOKE TEST</div>
    <section>
      <h1>Can this screen<br>reach the net?</h1>
      <div class="row" id="r1" class="wait">1. Page rendering … <span class="ok">YES</span></div>
      <div class="row wait" id="r2">2. Plain fetch … checking</div>
      <div class="row wait" id="r3">3. Firebase read … checking</div>
      <div class="row wait" id="r4">4. Live updates … checking</div>
    </section>
    <div class="meta" id="tick">—</div>
  </main>

  <script type="module">
    const set = (id, text, cls) => {
      const el = document.getElementById(id);
      el.className = 'row ' + cls;
      el.textContent = text;
    };

    // 2. Can we make any network request at all?
    try {
      const r = await fetch('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js', { method: 'HEAD' });
      set('r2', '2. Plain fetch … OK (' + r.status + ')', 'ok');
    } catch (e) {
      set('r2', '2. Plain fetch … BLOCKED', 'bad');
    }

    // 3 + 4. Can we read Firebase, and do live updates arrive?
    try {
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const { getDatabase, ref, onValue, set: dbSet } =
        await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const { firebaseConfig } = await import('./config.js');

      const db = getDatabase(initializeApp(firebaseConfig));
      const probe = ref(db, 'smoketest/heartbeat');

      let count = 0;
      onValue(probe, snap => {
        count++;
        set('r3', '3. Firebase read … OK', 'ok');
        if (count > 1) set('r4', '4. Live updates … OK (' + count + ' received)', 'ok');
        document.getElementById('tick').textContent = 'VALUE: ' + JSON.stringify(snap.val());
      }, err => {
        set('r3', '3. Firebase read … FAILED: ' + err.code, 'bad');
      });

      // write a heartbeat every 3s so we can prove updates flow
      setInterval(() => dbSet(probe, Date.now()).catch(() => {}), 3000);

    } catch (e) {
      set('r3', '3. Firebase read … IMPORT FAILED', 'bad');
      document.getElementById('tick').textContent = String(e).slice(0, 70);
    }
  </script>
</body>
</html>
